version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: novacore-postgres
    restart: always
    environment:
      POSTGRES_DB: novacore_db
      POSTGRES_USER: novacore_user
      POSTGRES_PASSWORD: novacore_password
    ports:
      - "5432:5432"
    volumes:
      - novacore-postgres-data:/var/lib/postgresql/data
  adminer:
    image: adminer:latest
    container_name: novacore-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  novacore-postgres-data:
    driver: local
