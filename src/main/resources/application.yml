server:
  port: 8080

spring:
  application:
    name: novacore-banking
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/novacore_db
    username: novacore_user
    password: novacore_password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

novacore:
  idempotency:
    reaper:
      timeout-seconds: 30
      fixed-rate-ms: 5000
