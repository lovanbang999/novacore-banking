server:
  port: 8080

spring:
  application:
    name: novacore-banking
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/novacore_db
    username: novacore_user
    password: novacore_password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: method # Sort operations by method (GET, POST, etc.)
      tags-sorter: method # Sort tags by method (GET, POST, etc.)
      display-request-duration: true # Display request duration
      doc-expansion: list # Expand all operations by default
      enabled: true # Enable swagger ui

novacore:
  idempotency:
    reaper:
      timeout-seconds: 30
      fixed-rate-ms: 5000
